<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="atelier-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24201D" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
  </defs>

  <!-- Base Container -->
  <rect width="64" height="64" rx="14" fill="url(#atelier-bg)" />

  <!-- Outer Sage Architectural Frame -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="10.5" stroke="#5F7A6A" stroke-width="1.25" stroke-opacity="0.65" />

  <!-- Inner Subtle Linen Hairline -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="8" stroke="#F5F1EB" stroke-width="0.75" stroke-opacity="0.12" />

  <!-- Top Editorial Accent Bar -->
  <line x1="21" y1="3.5" x2="43" y2="3.5" stroke="#7D9E8B" stroke-width="2" stroke-linecap="round" />

  <!-- Monogram TD -->
  <text
    x="29"
    y="42.5"
    text-anchor="middle"
    fill="#F5F1EB"
    font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
    font-size="26.5"
    font-style="italic"
    font-weight="600"
    letter-spacing="-0.5"
  >TD</text>

  <!-- Signature Sage Period Dot (aligned to baseline) -->
  <circle cx="50" cy="39.8" r="2.7" fill="#5F7A6A" />
</svg>
